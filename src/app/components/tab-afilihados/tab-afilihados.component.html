<mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <!-- Position Column -->
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let cadastro"> {{cadastro.id}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="casal">
        <th mat-header-cell *matHeaderCellDef> Casal </th>
        <td mat-cell *matCellDef="let cadastro"> {{cadastro.esposo_nome}} e {{cadastro.esposa_nome}} </td>
    </ng-container>

    <!-- Weight Column -->
    <div class="acao">
        <ng-container matColumnDef="acao">
            <th mat-header-cell *matHeaderCellDef> Ação </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button style="color: red;">
                    <mat-icon>delete_forever</mat-icon>
                </button>
                <button mat-icon-button>
                    <mat-icon>add_circle</mat-icon>
                </button>
                <button mat-icon-button style="color: blue;">
                    <mat-icon>search</mat-icon>
                </button>
            </td>
        </ng-container>
    </div>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <!-- <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
  </tr> -->
</table>
